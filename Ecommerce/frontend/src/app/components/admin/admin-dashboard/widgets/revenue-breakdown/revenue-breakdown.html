<div class="panel revenue-panel">
  <div class="panel-header">
    <div>
      <h3>Revenue Breakdown</h3>
      <p class="panel-subtitle">Gross sales, this year</p>
    </div>
  </div>

  @if (loading()) {
    <div class="skeleton-chart">
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <div class="skeleton-bar-col">
          <div class="skeleton-bar"></div>
          <div class="skeleton-label"></div>
        </div>
      }
    </div>
  } @else if (error()) {
    <div class="error-container">
      <span>{{ error() }}</span>
      <button (click)="fetchRevenueBreakdown()" class="retry-btn">Retry</button>
    </div>
  } @else if (revenueBreakdown()) {
    <div class="bar-chart">
      @for (point of revenueChartData(); track point.label) {
        <div class="bar-col">
          <div class="bar" [style.height.%]="barHeightPercent(point.value)"></div>
          <span class="bar-label">{{ point.label }}</span>
        </div>
      }
    </div>
  }
</div>
