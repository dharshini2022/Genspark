<section class="loginSection">
    <div class="card shadow p-4" style="width: 400px;">
        <h2 class="text-center mb-4">Login</h2>

        <form (ngSubmit)="handleLoginClick()">

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" [formField]="loginForm.username">
                @if(loginForm.username().touched()){
                    @for (error of loginForm.username().errors(); track error.message) {
                        <div class="alert alert-danger mt-2 py-2"> {{ error.message }}</div>
                    }
                }
            </div>

            <div class="mb-3">
                <label for="password" class="form-label"> Password</label>
                <input type="password" id="password" class="form-control" [formField]="loginForm.password">
                @if(loginForm.password().touched()){
                    @for (error of loginForm.password().errors(); track error.message) {
                        <div class="alert alert-danger mt-2 py-2"> {{ error.message }} </div>
                    }
                }
            </div>

            <button class="btn btn-primary w-100 d-flex justify-content-center align-items-center gap-2" [disabled]="progress()" type="submit">
                @if (!progress()) {
                    <span>Login</span>
                }

                @if (progress()) {
                    <div
                        class="spinner-border spinner-border-sm"
                        role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>

                    <span>Logging in...</span>
                }
            </button>

        </form>
    </div>
</section>
