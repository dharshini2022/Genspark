<div class="card">
  <div class="position-relative">
    <img class="card-img-top img-fluid" [src]="product()?.thumbnail" alt="{{product()?.title}}">
    @if ((product()?.stock ?? 0) <= 0) {
      <span class="position-absolute top-0 end-0 m-2 badge bg-danger">Out of Stock</span>
    } @else if ((product()?.stock ?? 0) < 5) {
      <span class="position-absolute top-0 end-0 m-2 badge bg-warning text-dark">Low Stock</span>
    }
  </div>
  <div class="card-body d-flex flex-column justify-content-between p-3">
    <div>
      <h5 class="card-title text-truncate mb-1" style="font-weight: 600;" title="{{product()?.title}}">{{product()?.title}}</h5>
      <p class="card-text text-muted mb-3" style="font-size: 0.875rem; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; height: 2.5rem;">
        {{product()?.description}}
      </p>
    </div>
    <div class="mt-auto">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <span class="badge bg-light text-dark border">Stock: {{product()?.stock}}</span>
        <span class="h5 mb-0 text-success fw-bold">${{product()?.price}}</span>
      </div>
      <button (click)="handleClick()" class="btn btn-success w-100 py-2 fw-semibold" [disabled]="(product()?.stock ?? 0) <= 0">
        Buy Now
      </button>
      <button (click)="viewProductDetail()" class="btn btn-success w-100 py-2 fw-semibold" style="margin-top: 10px;">
        View Product
      </button>
    </div>
  </div>
</div>
