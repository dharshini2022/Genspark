# On applying, this does not create pod, it continously monitors the CPU usage and changes replica value in a deployment as per the need.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    # reference deployment name for monitoring
    name: api
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # new replica created when every active replica cpu usage crossed 50%
          averageUtilization: 50
